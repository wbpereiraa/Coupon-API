services:
  coupon-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coupon-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/swagger-ui/index.html || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
